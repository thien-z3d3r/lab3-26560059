<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Shop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="shop-header">
    <div class="header-content">
      <div class="brand">
        <h1>Mini Shop</h1>
      </div>
      <div class="cart-summary">
        <span class="total-price" id="cartTotal">Total: 0 ₫</span>
        <div class="cart-badge-container" aria-label="Shopping cart">
          <span class="cart-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="21" r="1"></circle>
              <circle cx="20" cy="21" r="1"></circle>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
          </span>
          <span class="cart-badge" id="cartBadge">0</span>
        </div>
        <button type="button" class="clear-cart-btn" id="clearCartBtn">Clear Cart</button>
      </div>
    </div>
  </header>

  <main class="shop-container">
    <section class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search products..." autocomplete="off" aria-label="Search products">
      </div>
      <div class="category-filters" id="categoryFilters">
        <button type="button" class="filter-btn active" data-category="All">All</button>
        <button type="button" class="filter-btn" data-category="Electronics">Electronics</button>
        <button type="button" class="filter-btn" data-category="Fashion">Fashion</button>
        <button type="button" class="filter-btn" data-category="Books">Books</button>
      </div>
    </section>

    <div class="product-grid" id="productGrid"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
